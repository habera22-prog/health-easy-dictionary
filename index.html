<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>생활건강 쉬운사전</title>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="생활건강 쉬운사전" />
  <meta property="og:description" content="건강검진표, 병원 용어, 자주 듣는 병명, 암 관련 표현, 검사·치료 용어, 약봉투 용어를 쉽게 찾아보세요." />
  <meta property="og:site_name" content="생활건강 쉬운사전" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="생활건강 쉬운사전" />
  <meta name="twitter:description" content="병원에서 들은 어려운 건강 용어를 쉽게 찾아보세요." />
  
  <style>
    :root {
      --base-font: 21px;
      --bg: #f4f5f7;
      --paper: #ffffff;
      --text: #1f2328;
      --muted: #646b73;
      --line: #d8dde3;
      --navy: #2f3742;
      --navy2: #151a20;
      --bluegray: #eef1f5;
      --mint: #eef7f3;
      --peach: #fff4ea;
      --lavender: #f3f0fa;
      --rose: #fff1f1;
      --warning-bg: #fff8ee;
      --warning-line: #efcf9c;
      --danger: #b23b3b;
      --danger-bg: #fff1f1;
      --danger-line: #efc2c2;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: "Noto Sans KR", "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: var(--base-font);
      line-height: 1.68;
      word-break: keep-all;
    }

    .page {
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px;
    }

    .hero {
      background: linear-gradient(180deg, #ffffff 0%, #fbfcfe 100%);
      border: 1px solid var(--line);
      border-left: 8px solid var(--navy2);
      border-radius: 4px;
      padding: 28px;
      margin-bottom: 16px;
    }

    .eyebrow {
      color: var(--navy2);
      font-size: 0.78em;
      font-weight: 900;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--navy2);
      font-size: 1.95em;
      line-height: 1.22;
      letter-spacing: -0.04em;
    }

    .hero p {
      margin: 0;
      color: #3b4654;
      font-size: 1.02em;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 0 2px 10px rgba(92, 115, 145, 0.06);
      position: sticky;
      top: 0;
      z-index: 10;
    }


    .search-group {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) 150px 110px;
      gap: 10px;
      width: 100%;
    }

    .search-group input {
      width: 100%;
      min-height: 64px;
      font-size: 1.05em;
      padding: 15px 18px;
      border-width: 2px;
    }

    .search-btn {
      min-height: 64px;
      font-size: 1.02em;
      padding: 14px 18px;
    }

    .reset-btn {
      min-height: 64px;
      font-size: 0.95em;
    }

    input {
      flex: 1;
      min-width: 250px;
      min-height: 54px;
      border: 2px solid var(--line);
      border-radius: 3px;
      padding: 12px 15px;
      font-size: 0.95em;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    input:focus { border-color: var(--navy); }

    button {
      min-height: 54px;
      border: 1px solid var(--navy);
      border-radius: 3px;
      padding: 12px 16px;
      background: var(--navy2);
      color: white;
      font-size: 0.9em;
      font-weight: 900;
      cursor: pointer;
    }

    button:hover { background: #000000; }

    button.secondary {
      background: #eef0f2;
      color: var(--navy2);
      border-color: #d6dfeb;
    }

    button.secondary:hover { background: #e6e8eb; }

    .layout {
      display: grid;
      grid-template-columns: 270px 1fr;
      gap: 16px;
      align-items: start;
    }

    .side {
      position: sticky;
      top: 94px;
      background: #fcfdff;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(92, 115, 145, 0.05);
    }

    .side h2 {
      margin: 0 0 12px;
      font-size: 1em;
      color: var(--navy2);
    }

    .category-list {
      display: grid;
      gap: 8px;
    }

    .category-list button {
      width: 100%;
      text-align: left;
      background: #fff;
      color: var(--navy2);
      border-color: var(--line);
      padding: 11px 13px;
      min-height: 48px;
    }

    .category-list button.active {
      background: var(--navy2);
      color: white;
      border-color: var(--navy);
    }


    .category-list button.warning-cat {
      color: #b04a4a;
      background: #fff1f1;
      border-color: #efc2c2;
      font-weight: 900;
    }

    .category-list button.warning-cat:hover {
      background: #fde7e7;
    }

    .category-list button.warning-cat.active {
      background: #b04a4a;
      color: #ffffff;
      border-color: #b04a4a;
    }

    .notice {
      margin-top: 14px;
      padding: 14px;
      border-radius: 3px;
      background: var(--warning-bg);
      border-left: 4px solid #e5b66d;
      border: 1px solid var(--warning-line);
      color: #66451f;
      font-size: 0.78em;
      line-height: 1.58;
    }

    .main { min-width: 0; }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 16px;
    }

    .stat strong {
      display: block;
      font-size: 1.35em;
      line-height: 1.1;
      color: var(--navy2);
    }

    .stat span {
      color: var(--muted);
      font-size: 0.76em;
      font-weight: 800;
    }

    
    .stats .stat:nth-child(1) { background: var(--mint); }
    .stats .stat:nth-child(2) { background: var(--peach); }
    .stats .stat:nth-child(3) { background: var(--lavender); }

    .cards {
      display: grid;
      gap: 12px;
    }

    .term-card {
      background: #ffffff;
      border: 1px solid var(--line);
      border-left: 5px solid #c9d7e6;
      border-radius: 4px;
      padding: 20px;
    }

    .term-card.danger {
      border-color: var(--danger-line);
      background: var(--danger-bg);
      border-left: 5px solid #df9c9c;
    }

    .meta {
      display: inline-block;
      font-size: 0.72em;
      font-weight: 900;
      color: var(--navy);
      background: var(--bluegray);
      padding: 5px 10px;
      border-radius: 2px;
      margin-bottom: 9px;
    }

    .danger .meta {
      color: var(--danger);
      background: #f7dfdc;
    }

    .term-title {
      font-size: 1.38em;
      line-height: 1.28;
      font-weight: 950;
      letter-spacing: -0.03em;
      color: var(--navy2);
      margin-bottom: 12px;
    }

    .danger .term-title { color: var(--danger); }

    .desc {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .desc-block {
      background: #fbfcfe;
      border: 1px solid #e4e8ee;
      border-radius: 3px;
      padding: 14px;
    }

    .desc-block:nth-child(1) { background: #f7fbff; }
    .desc-block:nth-child(2) { background: #fffaf5; }

    .desc-block strong {
      display: block;
      margin-bottom: 5px;
      color: var(--navy2);
      font-size: 0.82em;
    }

    .desc-block p {
      margin: 0;
      color: #303844;
    }

    .empty {
      background: var(--paper);
      border: 1px dashed var(--line);
      border-radius: 4px;
      padding: 34px;
      text-align: center;
      color: var(--muted);
      font-weight: 800;
    }

    .source-note {
      margin-top: 12px;
      background: #fbfcfe;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 16px;
      color: var(--muted);
      font-size: 0.78em;
      line-height: 1.6;
    }

    .brand {
      text-align: center;
      color: var(--muted);
      margin-top: 18px;
      font-size: 0.76em;
    }

  @media (max-width: 860px) {
  .page {
    padding: 10px;
  }

  .hero {
    padding: 18px;
  }

  .hero h1 {
    font-size: 1.55em;
  }

  .hero p {
    font-size: 0.9em;
  }

  .toolbar {
    position: static;
    padding: 12px;
  }

  .search-group {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .search-group input,
  .search-btn,
  .reset-btn {
    width: 100%;
    min-height: 56px;
  }

  .toolbar > button,
  .toolbar .secondary {
    min-height: 48px;
    padding: 10px 12px;
    font-size: 0.85em;
  }

  /* 모바일에서는 좌측 메뉴를 위쪽 가로 메뉴로 변경 */
  .layout {
    display: block;
  }

  .side {
    position: sticky;
    top: 0;
    z-index: 9;
    margin-bottom: 12px;
    padding: 12px;
    background: #ffffff;
    border: 1px solid var(--line);
  }

  .side h2 {
    font-size: 0.95em;
    margin: 0 0 8px;
  }

  .category-list {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }

  .category-list button {
    flex: 0 0 auto;
    white-space: nowrap;
    font-size: 0.78em;
    padding: 10px 12px;
    min-height: 42px;
    line-height: 1.2;
  }

  .notice {
    display: none;
  }

  .main {
    min-width: 0;
  }

  .stats {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .stat {
    padding: 12px;
  }

  .cards {
    gap: 10px;
  }

  .term-card {
    padding: 14px;
  }

  .term-title {
    font-size: 1.12em;
  }

  .desc {
    grid-template-columns: 1fr;
  }

  .desc-block {
    padding: 12px;
  }

  .source-note {
    font-size: 0.72em;
  }
}

    @media print {
      body { background: white; font-size: 16px; }
      .toolbar, .side { display: none; }
      .layout { display: block; }
      .hero, .term-card, .stat, .source-note { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <div class="eyebrow">건강정보 참고자료</div>
      <h1>생활건강 쉬운사전</h1>
      <p>건강검진표, 병원 표현, 자주 듣는 병명, 암 관련 표현, 검사·치료 용어, 약봉투 용어를 쉽게 찾아볼 수 있도록 정리했습니다.</p>
    </section>

    <div class="toolbar">
      <div class="search-group">
        <input id="searchInput" type="search" placeholder="검색어를 입력하세요. 예: 암, 혈압, 당뇨, CT, 약, 어지럼" onkeydown="handleSearchKey(event)" />
        <button class="search-btn" onclick="render()">검색하기</button>
        <button class="secondary reset-btn" onclick="clearSearch()">초기화</button>
      </div>
      <button onclick="changeFont(1)">글씨 크게 +4</button>
      <button class="secondary" onclick="changeFont(-1)">글씨 작게 -4</button>
      <button class="secondary" onclick="resetFont()">기본 크기</button>
      <button class="secondary" onclick="window.print()">인쇄</button>
    </div>

    <div class="layout">
      <aside class="side">
        <h2>분류</h2>
        <div id="categoryList" class="category-list"></div>
        <div class="notice">
          이 자료는 건강 정보를 쉽게 이해하기 위한 참고용입니다.<br>
          진단, 치료, 약 복용 변경은 반드시 의사·약사와 상담해 주세요.
        </div>
      </aside>

      <main class="main">
        <div class="stats">
          <div class="stat"><strong id="totalCount">0</strong><span>전체 용어</span></div>
          <div class="stat"><strong id="visibleCount">0</strong><span>현재 표시</span></div>
          <div class="stat"><strong id="fontSizeLabel">21px</strong><span>현재 글씨 크기</span></div>
        </div>

        <div id="cards" class="cards"></div>
        <div id="empty" class="empty" style="display:none;">검색 결과가 없습니다.</div>

        <div class="source-note">
          참고: 공공 건강정보를 바탕으로 일상에서 이해하기 쉽게 풀어쓴 자료입니다.
        </div>

        <div class="brand">생활건강 쉬운사전</div>
      </main>
    </div>
  </div>

    const rawCategories = Array.from(new Set(DATA.map(x => x.category)));
    const orderedCategories = rawCategories.filter(x => x !== '바로 확인할 신호');
    const CATEGORIES = ['전체', '바로 확인할 신호', ...orderedCategories.filter(x => x !== '바로 확인할 신호')];
    let currentCategory = '전체';
    const FONT_SIZES = [19, 23, 27, 31];
    let fontSizeIndex = Number(localStorage.getItem('seniorHealthFontIndexV9') || 1);
    let fontSize = FONT_SIZES[fontSizeIndex];

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function applyFont() {
      fontSize = FONT_SIZES[fontSizeIndex];
      document.documentElement.style.setProperty('--base-font', fontSize + 'px');
      document.getElementById('fontSizeLabel').textContent = fontSize + 'px';
      localStorage.setItem('seniorHealthFontIndexV9', fontSizeIndex);
    }

    function changeFont(delta) {
      fontSizeIndex = Math.max(0, Math.min(FONT_SIZES.length - 1, fontSizeIndex + delta));
      applyFont();
    }

    function resetFont() {
      fontSizeIndex = 1;
      applyFont();
    }

    function setCategory(cat) {
      currentCategory = cat;
      renderCategoryList();
      render();
    }

    function renderCategoryList() {
      const box = document.getElementById('categoryList');
      box.innerHTML = CATEGORIES.map(cat => {
        const classes = [];
        if (cat === currentCategory) classes.push('active');
        if (cat === '바로 확인할 신호') classes.push('warning-cat');
        return `
        <button class="${classes.join(' ')}" onclick="setCategory('${cat}')">
          ${escapeHtml(cat)}
        </button>
      `;
      }).join('');
    }

    function render() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();

      const filtered = DATA.filter(item => {
        const categoryOk = currentCategory === '전체' || item.category === currentCategory;
        const text = `${item.category} ${item.term} ${item.simple} ${item.point}`.toLowerCase();
        return categoryOk && (!q || text.includes(q));
      });

      document.getElementById('totalCount').textContent = DATA.length;
      document.getElementById('visibleCount').textContent = filtered.length;

      const cards = document.getElementById('cards');
      const empty = document.getElementById('empty');

      if (!filtered.length) {
        cards.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';
      cards.innerHTML = filtered.map(item => {
        const isDanger = item.category === '바로 확인할 신호';
        return `
          <article class="term-card ${isDanger ? 'danger' : ''}">
            <div class="meta">${escapeHtml(item.category)}</div>
            <div class="term-title">${escapeHtml(item.term)}</div>
            <div class="desc">
              <div class="desc-block">
                <strong>쉽게 말하면</strong>
                <p>${escapeHtml(item.simple)}</p>
              </div>
              <div class="desc-block">
                <strong>꼭 기억할 점</strong>
                <p>${escapeHtml(item.point)}</p>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function handleSearchKey(event) {
      if (event.key === 'Enter') {
        render();
      }
    }

    function clearSearch() {
      document.getElementById('searchInput').value = '';
      render();
    }

    applyFont();
    renderCategoryList();
    render();
  </script>
